name: 战网 FunCaptcha HTTP 多轮题图采集

on:
  workflow_dispatch:
    inputs:
      count:
        description: "并行采集数量（1-256）"
        required: false
        default: "1"
        type: string
      max_parallel:
        description: "最大并发任务数（1-20）"
        required: false
        default: "5"
        type: string
      captcha_image_wait:
        description: "每轮等待 Arkose 题图加载的秒数"
        required: false
        default: "75"
        type: string
      proxy:
        description: "可选代理：ip:端口:用户名:密码；留空则使用 GitHub 直连"
        required: false
        default: ""
        type: string
      artifact_mode:
        description: "构件输出模式"
        required: false
        default: "solver_images"
        type: choice
        options:
          - solver_images
          - full_debug

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.matrix.outputs.indices }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
      - name: 校验输入并生成任务矩阵
        id: matrix
        env:
          REQUESTED_COUNT: ${{ inputs.count }}
          REQUESTED_MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def bounded_int(name, raw, upper):
              try:
                  value = int(raw)
              except (TypeError, ValueError):
                  raise SystemExit(f"{name} must be an integer: {raw!r}")
              if not 1 <= value <= upper:
                  raise SystemExit(f"{name} must be in 1..{upper}: {value}")
              return value

          count = bounded_int("count", os.environ["REQUESTED_COUNT"], 256)
          parallel = bounded_int("max_parallel", os.environ["REQUESTED_MAX_PARALLEL"], 20)
          parallel = min(count, parallel, 20)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fp:
              fp.write(f"indices={json.dumps(list(range(1, count + 1)))}\n")
              fp.write(f"max_parallel={parallel}\n")
          print(f"任务矩阵：数量={count}，最大并发={parallel}")
          PY

  deps-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 缓存 RuyiPage 虚拟环境
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ruyipage-snapshot-venv-${{ runner.os }}-py312-${{ hashFiles('requirements-ruyipage-v4.txt') }}
          restore-keys: |
            ruyipage-snapshot-venv-${{ runner.os }}-py312-

      - name: 构建 RuyiPage 虚拟环境
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-ruyipage-v4.txt
          .venv/bin/python - <<'PY'
          import importlib.util
          required = ["ruyipage", "curl_cffi", "bs4", "websocket", "requests", "PIL", "numpy", "cv2"]
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"missing modules: {missing}")
          import register_ruyipage_v4
          print("RuyiPage 快照依赖检查通过")
          PY

      - name: 缓存 RuyiPage Firefox 运行时
        id: ruyi-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-${{ runner.os }}-v1
          restore-keys: |
            ruyipage-firefox-${{ runner.os }}-

      - name: 安装 RuyiPage Firefox 运行时
        if: steps.ruyi-runtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          .venv/bin/python -m ruyipage install
          .venv/bin/python -m ruyipage doctor

  snapshot:
    needs: [prepare, deps-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.indices) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 恢复 RuyiPage 虚拟环境
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ruyipage-snapshot-venv-${{ runner.os }}-py312-${{ hashFiles('requirements-ruyipage-v4.txt') }}
          restore-keys: |
            ruyipage-snapshot-venv-${{ runner.os }}-py312-

      - name: 恢复 RuyiPage Firefox 运行时
        id: ruyi-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-${{ runner.os }}-v1
          restore-keys: |
            ruyipage-firefox-${{ runner.os }}-

      - name: 激活并补齐依赖
        env:
          VENV_CACHE_HIT: ${{ steps.venv.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$VENV_CACHE_HIT" != "true" ] || [ ! -x .venv/bin/python ]; then
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements-ruyipage-v4.txt
          fi
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          if ! .venv/bin/python -m ruyipage doctor >/dev/null 2>&1; then
            .venv/bin/python -m ruyipage install
            .venv/bin/python -m ruyipage doctor
          fi
          .venv/bin/python -m py_compile funcaptcha_http_snapshots.py

      - name: 确保 Xvfb 可用
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth
          fi

      - name: 运行 HTTP + RuyiPage 多轮 FunCaptcha 截图
        env:
          PYTHONUNBUFFERED: "1"
          HEADLESS: "1"
          CAPTCHA_IMAGE_WAIT: "${{ inputs.captcha_image_wait }}"
          REGISTRATION_PROXY: "${{ inputs.proxy }}"
          SNAPSHOT_OUTPUT_DIR: "funcaptcha_snapshot_debug"
        run: |
          set -euo pipefail
          if [ -n "$REGISTRATION_PROXY" ]; then
            echo "::add-mask::$REGISTRATION_PROXY"
          fi
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            .venv/bin/python funcaptcha_http_snapshots.py \
              --proxy "$REGISTRATION_PROXY" \
              --max-waves 16 \
              --capture-image-timeout "${CAPTCHA_IMAGE_WAIT:-75}"

      - name: 仅收集多轮 Arkose 题图
        if: ${{ always() && inputs.artifact_mode != 'full_debug' }}
        run: |
          set -euo pipefail
          mkdir -p solver_captcha_images
          find funcaptcha_snapshot_debug -type f \( \
            -name 'captcha_wave_*.jpg' -o \
            -name 'captcha_wave_*.jpeg' -o \
            -name 'captcha_wave_*.png' -o \
            -name 'captcha_wave_*.webp' \
          \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "solver_captcha_images/$(basename "$file")"
          done
          find solver_captcha_images -type f | sort || true

      - name: 上传多轮 Arkose 题图
        if: ${{ always() && inputs.artifact_mode != 'full_debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: funcaptcha-solver-captcha-${{ matrix.index }}
          path: solver_captcha_images/*
          if-no-files-found: ignore

      - name: 上传安全调试数据与完整页面截图
        if: ${{ always() && inputs.artifact_mode == 'full_debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: funcaptcha-http-snapshot-${{ matrix.index }}
          path: |
            funcaptcha_snapshot_debug/**/run.log
            funcaptcha_snapshot_debug/**/summary.json
            funcaptcha_snapshot_debug/**/captured_rounds.json
            funcaptcha_snapshot_debug/**/account_generated.json
            funcaptcha_snapshot_debug/**/arkose_context.json
            funcaptcha_snapshot_debug/**/solver/**
            funcaptcha_snapshot_debug/**/solver_screenshots/**
            funcaptcha_snapshot_debug/**/captcha_images/**
            funcaptcha_snapshot_debug/**/_ruyi_failure_snapshots/**
          if-no-files-found: ignore

  collect:
    needs: snapshot
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载多轮 Arkose 题图构件
        if: ${{ inputs.artifact_mode != 'full_debug' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: funcaptcha-solver-captcha-*
          path: all_solver_captcha_images
          merge-multiple: true

      - name: 重新打包多轮 Arkose 题图
        if: ${{ inputs.artifact_mode != 'full_debug' }}
        run: |
          set -euo pipefail
          mkdir -p all_solver_captcha_images
          zip -j all-funcaptcha-solver-captcha-images.zip all_solver_captcha_images/* || true
          find all_solver_captcha_images -type f | sort || true

      - name: 上传合并后的多轮 Arkose 题图
        if: ${{ inputs.artifact_mode != 'full_debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: all-funcaptcha-solver-captcha-images
          path: all-funcaptcha-solver-captcha-images.zip
          if-no-files-found: ignore

      - name: 下载完整安全调试构件
        if: ${{ inputs.artifact_mode == 'full_debug' }}
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: funcaptcha-http-snapshot-*
          path: all_funcaptcha_snapshots
          merge-multiple: false

      - name: 重新打包完整安全调试构件
        if: ${{ inputs.artifact_mode == 'full_debug' }}
        run: |
          set -euo pipefail
          zip -r all-funcaptcha-http-snapshots.zip all_funcaptcha_snapshots || true
          find all_funcaptcha_snapshots -type f | sort | head -200 || true

      - name: 上传合并后的完整安全调试构件
        if: ${{ inputs.artifact_mode == 'full_debug' }}
        uses: actions/upload-artifact@v6
        with:
          name: all-funcaptcha-http-snapshots
          path: all-funcaptcha-http-snapshots.zip
          if-no-files-found: ignore
