name: 战网自动注册（CloakBrowser）

on:
  workflow_dispatch:
    inputs:
      capmonster_key:
        description: "CapMonster Cloud API 密钥（可选备用）"
        required: false
        default: ""
      count:
        description: "注册任务数量（1-256）"
        required: false
        default: "1"
      max_parallel:
        description: "最大并发任务数"
        required: false
        default: "10"

permissions:
  actions: write
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.gen.outputs.indices }}
      max_parallel: ${{ steps.gen.outputs.max_parallel }}
    steps:
      - name: 生成任务矩阵
        id: gen
        run: |
          N=${{ github.event.inputs.count }}
          N=${N:-1}
          if [ "$N" -gt 256 ]; then N=256; fi
          P=${{ github.event.inputs.max_parallel }}
          P=${P:-10}
          if [ "$P" -gt 20 ]; then P=20; fi
          indices=$(python3 -ESs -c 'import json,sys; n=int(sys.argv[1]); print(json.dumps(list(range(1, n+1))))' "$N")
          echo "indices=$indices" >> $GITHUB_OUTPUT
          echo "max_parallel=$P" >> $GITHUB_OUTPUT
          echo "任务矩阵：数量=$N，最大并发=$P"

  deps-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 缓存 wheelhouse
        id: wheelhouse
        uses: actions/cache@v5
        with:
          path: .wheelhouse
          key: wheelhouse-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'yolo/requirements.txt') }}
          restore-keys: |
            wheelhouse-${{ runner.os }}-py312-

      - name: 构建 wheelhouse
        if: steps.wheelhouse.outputs.cache-hit != 'true'
        run: |
          set -e
          python -m pip install --upgrade pip
          mkdir -p .wheelhouse
          pip download -r requirements.txt -d .wheelhouse
          echo "wheelhouse 数量：$(find .wheelhouse -type f -name '*.whl' | wc -l)"

      - name: 缓存虚拟环境
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'yolo/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py312-

      - name: 构建虚拟环境
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          set -e
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          if [ -n "$(find .wheelhouse -type f -name '*.whl' -print -quit 2>/dev/null)" ]; then
            .venv/bin/pip install --no-index --find-links .wheelhouse -r requirements.txt
          else
            .venv/bin/pip install -r requirements.txt
          fi
          .venv/bin/python - <<'PY'
          import importlib.util
          mods = ["cloakbrowser", "websocket", "requests", "onnxruntime", "cv2", "PIL", "numpy", "ultralytics"]
          missing = [m for m in mods if importlib.util.find_spec(m) is None]
          if missing:
              raise SystemExit(f"missing modules: {missing}")
          print("虚拟环境依赖检查通过")
          PY

      - name: 缓存 CloakBrowser 程序
        id: cloak
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}-v2
          restore-keys: |
            cloakbrowser-${{ runner.os }}-

      - name: 预热 CloakBrowser 程序
        if: steps.cloak.outputs.cache-hit != 'true'
        run: |
          set -e
          .venv/bin/python -m cloakbrowser install

  register:
    needs: [prepare, deps-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.prepare.outputs.max_parallel) }}
      matrix:
        index: ${{ fromJson(needs.prepare.outputs.indices) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 恢复虚拟环境
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'yolo/requirements.txt') }}
          restore-keys: |
            venv-${{ runner.os }}-py312-

      - name: 恢复 wheelhouse 备用缓存
        if: steps.venv.outputs.cache-hit != 'true'
        id: wheelhouse
        uses: actions/cache@v5
        with:
          path: .wheelhouse
          key: wheelhouse-${{ runner.os }}-py312-${{ hashFiles('requirements.txt', 'yolo/requirements.txt') }}
          restore-keys: |
            wheelhouse-${{ runner.os }}-py312-

      - name: 恢复 CloakBrowser 程序
        id: cloak
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-${{ runner.os }}-v2
          restore-keys: |
            cloakbrowser-${{ runner.os }}-

      - name: 激活并安装依赖
        env:
          VENV_CACHE_HIT: ${{ steps.venv.outputs.cache-hit }}
        run: |
          set -e
          if [ "$VENV_CACHE_HIT" != "true" ] || [ ! -x .venv/bin/python ]; then
          echo "虚拟环境精确缓存未命中，正在从 wheelhouse 或 pip 安装/更新"
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            if [ -n "$(find .wheelhouse -type f -name '*.whl' -print -quit 2>/dev/null)" ]; then
              .venv/bin/pip install --no-index --find-links .wheelhouse -r requirements.txt
            else
              .venv/bin/pip install -r requirements.txt
            fi
          else
          echo "虚拟环境精确命中缓存；跳过 pip 安装"
          fi
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          .venv/bin/python -V
          if [ ! -d "$HOME/.cloakbrowser" ] || [ -z "$(find "$HOME/.cloakbrowser" -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "CloakBrowser 缓存未命中；正在安装二进制文件"
            .venv/bin/python -m cloakbrowser install
          else
            echo "CloakBrowser 缓存已命中；跳过安装"
          fi

      - name: 脱敏 CapMonster 密钥
        if: ${{ github.event.inputs.capmonster_key != '' }}
        run: echo "::add-mask::${{ github.event.inputs.capmonster_key }}"

      - name: 运行注册
        env:
          CAPMONSTER_API_KEY: ${{ github.event.inputs.capmonster_key }}
          PYTHONUNBUFFERED: "1"
          MATRIX_INDEX: "${{ matrix.index }}"
        run: python register.py

      - name: 上传截图和调试数据
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reg-data-${{ matrix.index }}
          path: |
            success.png
            error_*.png
            captcha_solve_debug/**
          if-no-files-found: ignore

      - name: 上传账号数据
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reg-accounts-${{ matrix.index }}
          path: registered_account.txt
          if-no-files-found: ignore

  collect:
    needs: register
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部账号构件
        uses: actions/download-artifact@v7
        with:
          pattern: reg-accounts-*
          path: all_accounts
          merge-multiple: false

      - name: 合并账号文件
        run: |
          > all_accounts.txt
          for f in all_accounts/*/registered_account.txt; do
            [ -f "$f" ] && cat "$f" >> all_accounts.txt && echo "" >> all_accounts.txt
          done
          [ -s all_accounts.txt ] || echo "(no successful accounts)" > all_accounts.txt

      - name: 上传合并后的账号数据
        uses: actions/upload-artifact@v6
        with:
          name: all-registered-accounts
          path: all_accounts.txt
          if-no-files-found: ignore
