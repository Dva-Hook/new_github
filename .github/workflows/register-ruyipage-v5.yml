      yescaptcha_key:
        description: "YesCaptcha API key (optional when YESCAPTCHA_API_KEY secret exists)"
        required: false
        default: ""
        type: string
      capmonster_key:
        description: "CapMonster API key (optional when CAPMONSTER_API_KEY secret exists)"
        required: false
        default: ""
        type: string
      browser:
        description: "Arkose browser adapter"
        required: true
        default: "ruyipage"
        type: choice
        options:
          - ruyipage
          - cloakbrowser
      network:
        description: "registration network route"
        required: true
        default: "direct"
        type: choice
        options:
          - direct
          - proxy
      proxy_file:
        description: "repository proxy pool path (used only for proxy mode)"
        required: true
        default: "IP.txt"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      indices: ${{ steps.matrix.outputs.indices }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
      country_code: ${{ steps.matrix.outputs.country_code }}
      country_name: ${{ steps.matrix.outputs.country_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate inputs, proxy pool, and generate matrix
        id: matrix
        env:
          REQUESTED_COUNT: ${{ inputs.count }}
          REQUESTED_MAX_PARALLEL: ${{ inputs.max_parallel }}
          REQUESTED_COUNTRY: ${{ inputs.country }}
          NETWORK_MODE: ${{ inputs.network }}
          PROXY_FILE: ${{ inputs.proxy_file }}
          SOLVER_MODE: ${{ inputs.solver }}
          BROWSER_MODE: ${{ inputs.browser }}
          YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY || inputs.yescaptcha_key }}
          CAPMONSTER_API_KEY: ${{ secrets.CAPMONSTER_API_KEY || inputs.capmonster_key }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          from v5_proxy_pool import load_proxy_pool

          def bounded_int(name, raw, upper):
              try:
                  value = int(raw)
              except (TypeError, ValueError):
                  raise SystemExit(f"{name} must be an integer, got {raw!r}")
              if not 1 <= value <= upper:
                  raise SystemExit(f"{name} must be in 1..{upper}, got {value}")
              return value

          count = bounded_int("count", os.environ["REQUESTED_COUNT"], 256)
          requested_parallel = bounded_int(
              "max_parallel", os.environ["REQUESTED_MAX_PARALLEL"], 20
          )
          max_parallel = min(requested_parallel, count, 20)
          country_file = Path("country_codes.txt")
          if not country_file.is_file():
              raise SystemExit(f"country code file not found: {country_file}")
          country_codes = {}
          for line_number, raw_line in enumerate(
              country_file.read_text(encoding="utf-8").splitlines(), start=1
          ):
              line = raw_line.strip()
              if not line:
                  continue
              try:
                  name, code = line.rsplit("----", 1)
              except ValueError as exc:
                  raise SystemExit(
                      f"invalid country code row {line_number}: {raw_line!r}"
                  ) from exc
              name = name.strip()
              code = code.strip().upper()
              if not name or len(code) != 3 or not code.isalpha():
                  raise SystemExit(
                      f"invalid country mapping at row {line_number}: {raw_line!r}"
                  )
              if name in country_codes:
                  raise SystemExit(f"duplicate country name: {name}")
              country_codes[name] = code
          country_name = os.environ["REQUESTED_COUNTRY"].strip()
          country_code = country_codes.get(country_name)
          if not country_code:
              raise SystemExit(f"unsupported country selection: {country_name!r}")
          solver = os.environ["SOLVER_MODE"].strip().lower()
          browser = os.environ["BROWSER_MODE"].strip().lower()
          yescaptcha_key = os.environ.get("YESCAPTCHA_API_KEY", "").strip()
          capmonster_key = os.environ.get("CAPMONSTER_API_KEY", "").strip()
          for value in (yescaptcha_key, capmonster_key):
              if value:
                  print(f"::add-mask::{value}")
          if solver == "yescaptcha" and not yescaptcha_key:
              raise SystemExit(
                  "yescaptcha requires the YESCAPTCHA_API_KEY repository secret "
                  "or the yescaptcha_key workflow input"
              )
          if solver == "capmonster" and not capmonster_key:
              raise SystemExit(
                  "capmonster requires the CAPMONSTER_API_KEY repository secret "
                  "or the capmonster_key workflow input"
              )
          network = os.environ["NETWORK_MODE"].strip().lower()
          if network not in {"direct", "proxy"}:
              raise SystemExit(f"unsupported network mode: {network}")
          if network == "proxy":
              root = Path.cwd().resolve()
              proxy_path = (root / os.environ["PROXY_FILE"]).resolve()
              if root not in proxy_path.parents:
                  raise SystemExit("proxy_file must stay inside the repository")
              if not proxy_path.is_file():
                  raise SystemExit(f"proxy file not found: {proxy_path}")
              records = load_proxy_pool(proxy_path)
              if len(records) < count:
                  raise SystemExit(
                      f"proxy pool has {len(records)} entries, but {count} jobs were requested"
                  )
              print(f"proxy pool valid: count={len(records)}, required={count}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fp:
              fp.write(f"indices={json.dumps(list(range(1, count + 1)))}\n")
              fp.write(f"max_parallel={max_parallel}\n")
              fp.write(f"country_code={country_code}\n")
              fp.write(f"country_name={country_name}\n")
          print(
              f"matrix size={count} max_parallel={max_parallel} "
              f"solver={solver} browser={browser} network={network} "
              f"country={country_name}({country_code})"
          )
          PY

  deps-cache:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache V5 virtualenv
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: v5-${{ inputs.solver }}-${{ inputs.browser }}-${{ runner.os }}-py312-${{ hashFiles('requirements-ruyipage-v5.txt', 'requirements-ruyipage-v4.txt', 'rank_v11/requirements.txt') }}

      - name: Build V5 virtualenv
        if: steps.venv.outputs.cache-hit != 'true'
        env:
          V5_SOLVER: ${{ inputs.solver }}
          V5_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -r requirements-ruyipage-v5.txt
          if [ "$V5_SOLVER" = "v11" ]; then
            .venv/bin/pip install torch torchvision \
              --index-url https://download.pytorch.org/whl/cpu
          fi
          if [ "$V5_BROWSER" = "cloakbrowser" ]; then
            .venv/bin/pip install "cloakbrowser>=0.4.10"
          fi

      - name: Validate selected dependencies
        env:
          V5_SOLVER: ${{ inputs.solver }}
          V5_BROWSER: ${{ inputs.browser }}
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          import os

          required = [
              "ruyipage", "curl_cffi", "bs4", "websocket", "requests",
              "PIL", "numpy", "cv2",
          ]
          if os.environ["V5_SOLVER"] == "v11":
              required.extend(["torch", "torchvision"])
          if os.environ["V5_BROWSER"] == "cloakbrowser":
              required.append("cloakbrowser")
          missing = [name for name in required if importlib.util.find_spec(name) is None]
          if missing:
              raise SystemExit(f"missing modules: {missing}")
          import register_ruyipage_v5
          print("V5 dependency check OK")
          PY

      - name: Cache RuyiPage Firefox runtime
        id: ruyi-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-${{ runner.os }}-v1

      - name: Install RuyiPage Firefox runtime
        if: steps.ruyi-runtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          .venv/bin/python -m ruyipage install
          .venv/bin/python -m ruyipage doctor

      - name: Cache CloakBrowser Chromium runtime
        if: inputs.browser == 'cloakbrowser'
        id: cloak-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-chromium-${{ runner.os }}-v1

      - name: Install CloakBrowser Chromium runtime
        if: inputs.browser == 'cloakbrowser' && steps.cloak-runtime.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import cloakbrowser
          cloakbrowser.ensure_binary()
          info = cloakbrowser.binary_info()
          if not info.get("installed"):
              raise SystemExit(f"CloakBrowser binary unavailable: {info}")
          print(f"CloakBrowser ready: version={info.get('version')}")
          PY

  register:
    needs: [prepare, deps-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.indices) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore V5 virtualenv
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: v5-${{ inputs.solver }}-${{ inputs.browser }}-${{ runner.os }}-py312-${{ hashFiles('requirements-ruyipage-v5.txt', 'requirements-ruyipage-v4.txt', 'rank_v11/requirements.txt') }}

      - name: Restore RuyiPage Firefox runtime
        id: ruyi-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cache/ruyipage
          key: ruyipage-firefox-${{ runner.os }}-v1

      - name: Restore CloakBrowser Chromium runtime
        if: inputs.browser == 'cloakbrowser'
        id: cloak-runtime
        uses: actions/cache@v5
        with:
          path: ~/.cloakbrowser
          key: cloakbrowser-chromium-${{ runner.os }}-v1

      - name: Restore V5 public static cache
        id: public-static-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/v5_public_static
          key: http-v5-public-static-v1-${{ github.run_id }}
          restore-keys: |
            http-v5-public-static-v1-

      - name: Repair missing cached dependencies
        if: steps.venv.outputs.cache-hit != 'true' || steps.ruyi-runtime.outputs.cache-hit != 'true' || (inputs.browser == 'cloakbrowser' && steps.cloak-runtime.outputs.cache-hit != 'true')
        env:
          V5_SOLVER: ${{ inputs.solver }}
          V5_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/pip install -r requirements-ruyipage-v5.txt
            if [ "$V5_SOLVER" = "v11" ]; then
              .venv/bin/pip install torch torchvision \
                --index-url https://download.pytorch.org/whl/cpu
            fi
            if [ "$V5_BROWSER" = "cloakbrowser" ]; then
              .venv/bin/pip install "cloakbrowser>=0.4.10"
            fi
          fi
          if ! .venv/bin/python -m ruyipage doctor >/dev/null 2>&1; then
            .venv/bin/python -m ruyipage install
            .venv/bin/python -m ruyipage doctor
          fi
          if [ "$V5_BROWSER" = "cloakbrowser" ]; then
            .venv/bin/python -c "import cloakbrowser; cloakbrowser.ensure_binary()"
          fi

      - name: Ensure Xvfb is available
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! command -v xauth >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb xauth
          fi

      - name: Allocate network route
        env:
          NETWORK_MODE: ${{ inputs.network }}
          PROXY_FILE: ${{ inputs.proxy_file }}
          JOB_INDEX: ${{ matrix.index }}
        run: |
          set -euo pipefail
          if [ "$NETWORK_MODE" = "proxy" ]; then
            .venv/bin/python v5_proxy_pool.py \
              --file "$PROXY_FILE" \
              --index "$JOB_INDEX" \
              --github-env
          else
            echo "REGISTRATION_PROXY=" >> "$GITHUB_ENV"
            echo "Network route: direct"
          fi

      - name: Mask selected provider credential
        if: inputs.solver == 'yescaptcha' || inputs.solver == 'capmonster'
        env:
          SOLVER_MODE: ${{ inputs.solver }}
          YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY || inputs.yescaptcha_key }}
          CAPMONSTER_API_KEY: ${{ secrets.CAPMONSTER_API_KEY || inputs.capmonster_key }}
        run: |
          set -euo pipefail
          if [ "$SOLVER_MODE" = "yescaptcha" ]; then
            provider_key="$YESCAPTCHA_API_KEY"
          else
            provider_key="$CAPMONSTER_API_KEY"
          fi
          test -n "$provider_key"
          echo "::add-mask::$provider_key"

      - name: Start persistent local V11 service
        if: inputs.solver == 'v11'
        env:
          RANK_V11_CACHE_DIR: ${{ runner.temp }}/rank_v11_cache_${{ matrix.index }}
        run: |
          set -euo pipefail
          nohup .venv/bin/python rank_v11/server.py \
            --host 127.0.0.1 \
            --port 8765 \
            --device cpu \
            --cpu-threads 2 \
            --mode accurate \
            --cache-dir "$RANK_V11_CACHE_DIR" \
            > rank_v11_server.log 2>&1 &
          echo $! > rank_v11_server.pid

      - name: Run HTTP V5 registration
        env:
          V5_SOLVER: ${{ inputs.solver }}
          V5_COUNTRY: ${{ needs.prepare.outputs.country_code }}
          RANK_V11_URL: http://127.0.0.1:8765
          YESCAPTCHA_API_KEY: ${{ secrets.YESCAPTCHA_API_KEY || inputs.yescaptcha_key }}
          CAPMONSTER_API_KEY: ${{ secrets.CAPMONSTER_API_KEY || inputs.capmonster_key }}
          V5_STATIC_CACHE_DIR: ${{ github.workspace }}/.cache/v5_public_static
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          mkdir -p "$V5_STATIC_CACHE_DIR"
          solver_click_args=(
            --click-style balanced
            --verify-timeout 35
            --first-image-timeout 45
          )
          if [ "$V5_SOLVER" = "yescaptcha" ]; then
            solver_click_args+=(
              --click-interval-min-ms 250
              --click-interval-max-ms 600
            )
          fi
          last_rc=1
          for attempt in 1 2 3; do
            echo "::group::V5 registration attempt ${attempt}/3"
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              .venv/bin/python register_ruyipage_v5.py \
                --solver "${{ inputs.solver }}" \
                --browser "${{ inputs.browser }}" \
                --country "$V5_COUNTRY" \
                --proxy "$REGISTRATION_PROXY" \
                --country-probe \
                --headless \
                "${solver_click_args[@]}" \
                --static-cache-dir "$V5_STATIC_CACHE_DIR" \
                --rank-v11-url "$RANK_V11_URL"
            last_rc=$?
            echo "V5 attempt ${attempt}/3 exited with ${last_rc}"
            echo "::endgroup::"
            if [ "$last_rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$last_rc" -eq 42 ]; then
              echo "Unsupported Arkose classification; stop without retry"
              exit 42
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit "$last_rc"

      - name: Save refreshed V5 public static cache
        if: always() && matrix.index == 1
        uses: actions/cache/save@v5
        with:
          path: .cache/v5_public_static
          key: http-v5-public-static-v1-${{ github.run_id }}

      - name: Stop local V11 service
        if: always() && inputs.solver == 'v11'
        run: |
          if [ -f rank_v11_server.pid ]; then
            kill "$(cat rank_v11_server.pid)" 2>/dev/null || true
          fi

      - name: Export successful account
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("ruyipage_http_v5_register/runs")
          records = []
          seen = set()
          for account_path in sorted(root.glob("run_*/account_generated.json")):
              run_dir = account_path.parent
              result_path = run_dir / "registration_result.json"
              if not result_path.is_file():
                  continue
              result = json.loads(result_path.read_text(encoding="utf-8"))
              if not result.get("ok"):
                  continue
              account = json.loads(account_path.read_text(encoding="utf-8"))
              email = str(account.get("email") or "")
              if not email or email.lower() in seen:
                  continue
              seen.add(email.lower())
              records.append(
                  "\n".join(
                      [
                          f"账号：{email}",
                          f"密码：{account.get('password', '')}",
                      ]
                  )
              )
          if records:
              Path("registered_account.txt").write_text(
                  "\n\n".join(records) + "\n", encoding="utf-8"
              )
          print(f"Recovered {len(records)} successful account(s)")
          PY

      - name: Upload V5 run data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: http-v5-${{ inputs.solver }}-${{ inputs.browser }}-reg-data-${{ matrix.index }}
          path: |
            rank_v11_server.log
            ruyipage_http_v5_register/runs/**
          if-no-files-found: ignore
          compression-level: 6

      - name: Upload V5 account data
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: http-v5-reg-accounts-${{ matrix.index }}
          path: registered_account.txt
          if-no-files-found: ignore
          compression-level: 9

  collect:
    needs: register
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all V5 account artifacts
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: http-v5-reg-accounts-*
          path: all_accounts
          merge-multiple: false

      - name: Merge account files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path("all_accounts").glob("**/registered_account.txt"))
          chunks = [path.read_text(encoding="utf-8").strip() for path in files]
          output = "\n\n".join(chunk for chunk in chunks if chunk).strip()
          Path("all_accounts.txt").write_text(
              (output + "\n") if output else "(no successful accounts)\n",
              encoding="utf-8",
          )
          print(f"Merged {len(files)} account file(s)")
          PY

      - name: Upload merged V5 account data
        uses: actions/upload-artifact@v6
        with:
          name: all-http-v5-registered-accounts
          path: all_accounts.txt
          if-no-files-found: error
          compression-level: 9
